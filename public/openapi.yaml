openapi: 3.1.0
info:
  title: Nova KYC API
  version: 1.0.0
  summary: Identity verification, KYB, review, credentials and monitoring for websites, mobile apps and backend systems.
  description: 'Nova KYC is a Nova Inc identity-verification platform. The recommended integration is deliberately simple:
    a server creates an applicant and a verification session, sends the person to the hosted phone-first flow, and learns
    the decision from a signed webhook or the Sessions API.


    Important boundaries:

    - API keys are server-side secrets. Never put one in a browser, mobile app, public repository or agent prompt.

    - The hosted flow is the capture product. There is no general API-only document/selfie upload endpoint.

    - The one upload exception is the Nigerian NIN slip inside the hosted flow.

    - Test and live keys select separate environments on the same production host.

    - Webhook payloads and reusable credentials carry claims and outcomes, never document images or raw biometric data.


    Human integration guide: https://kyc.novamail.store/docs

    Detailed developer guide: https://github.com/kilomene/KYC/blob/main/docs/DEVELOPER.md'
  contact:
    name: Nova Inc
    url: https://kyc.novamail.store
    email: info@novamail.store
servers:
- url: https://kyc.novamail.store
  description: Production (test and live environments are selected by API key)
- url: http://127.0.0.1:8765
  description: Local development default
tags:
- name: Developer resources
  description: Documentation and machine-readable specifications.
- name: Health
  description: Service capability health.
- name: Platform operations
  description: Nova operator only; not tenant self-service.
- name: Applicants
  description: People to be verified and privacy erasure.
- name: Sessions
  description: Verification sessions, checks and outcomes.
- name: Hosted flow
  description: The applicant-facing flow's token-scoped endpoints.
- name: Configuration
  description: Versioned per-level decision configuration.
- name: Keys
  description: Tenant API-key lifecycle metadata.
- name: Users and reviewer MFA
  description: Named reviewers and TOTP enrolment.
- name: Webhooks
  description: Signed event delivery, retries, dead letters and replay.
- name: Credentials
  description: Reusable signed verification credentials.
- name: Monitoring
  description: Ongoing screening and alerts.
- name: Billing and usage
  description: Metered usage and invoices.
- name: Businesses (KYB)
  description: Business records, people, registry evidence and evaluation.
- name: Review and cases
  description: Human review, four-eyes decisions, hits and audited media.
