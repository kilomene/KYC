          type: string
        framing:
          type: object
          additionalProperties: true
        read:
          type: object
          properties:
            first_name:
              type:
              - string
              - 'null'
            last_name:
              type:
              - string
              - 'null'
            dob:
              type:
              - string
              - 'null'
            number:
              type:
              - string
              - 'null'
            expiry:
              type:
              - string
              - 'null'
          additionalProperties: true
        missing:
          type: array
          items:
            type: string
        complete:
          type: boolean
        quality:
          type: object
          additionalProperties: true
        cross_engine:
          type: object
          additionalProperties: true
      additionalProperties: true
    ProcessingAccepted:
      type: object
      properties:
