    platformAdmin:
      type: apiKey
      in: header
      name: X-Platform-Admin
      description: Platform-operator token. Tenant creation and operator administration fail closed when the server has no
        platform token configured.
    flowTokenBearer:
      type: http
      scheme: bearer
      bearerFormat: Hosted-flow token
      description: Short-lived token returned when a session is created. It identifies one applicant session only and is used
        by the hosted flow, not as a tenant credential.
    flowTokenHeader:
      type: apiKey
      in: header
      name: X-Flow-Token
      description: Alternative presentation of the hosted-flow token.
  headers:
    RetryAfter:
      description: Seconds until the rate-limit window frees a slot.
      schema:
        type: integer
        minimum: 0
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: country required
          additionalProperties: false
      additionalProperties: false
    Environment:
      type: string
      enum:
      - test
      - live
    IdentitySource:
      type: string
      enum:
      - declared
      - document
    SessionStatus:
      type: string
      enum:
      - created
      - in_progress
      - processing
      - approved
      - rejected
      - needs_review
      - needs_more_information
      - expired
      - cancelled
    CheckStatus:
      type: string
      enum:
      - pass
      - fail
      - unclear
      - error
      - not_run
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        env:
          $ref: '#/components/schemas/Environment'
        external_ref:
          type:
          - string
          - 'null'
          description: The integrating product's own user reference.
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        dob:
          type:
          - string
          - 'null'
          format: date
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        email:
          type:
          - string
          - 'null'
          format: email
        phone:
          type:
          - string
          - 'null'
        address_line:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        identity_source:
          $ref: '#/components/schemas/IdentitySource'
        identity_document_id:
          type:
          - string
          - 'null'
          format: uuid
        data_deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    ApplicantCreate:
      oneOf:
      - $ref: '#/components/schemas/ApplicantCreateDeclared'
      - $ref: '#/components/schemas/ApplicantCreateDocument'
      description: Use the declared form only when the integrating product already has a lawful, reliable name and date of
        birth to cross-check. The document form is the recommended default because the platform reads identity from the presented
        document.
    ApplicantCreateDeclared:
      type: object
      required:
      - first_name
      - last_name
      - dob
      - country
      properties:
        identity_source:
          type: string
          enum:
          - declared
          default: declared
        first_name:
          type: string
          example: Adaeze
        last_name:
          type: string
          example: Example
        dob:
          type: string
          format: date
          example: '1992-04-17'
        country:
          type: string
          example: NG
        external_ref:
          type: string
          example: user_12345
        email:
          type: string
          format: email
        phone:
          type: string
        address_line:
          type: string
        city:
          type: string
    ApplicantCreateDocument:
      type: object
      required:
      - country
      - identity_source
      properties:
        identity_source:
          type: string
          enum:
          - document
        country:
          type: string
          example: NG
        external_ref:
          type: string
          example: user_12345
        email:
          type: string
          format: email
        phone:
          type: string
        address_line:
          type: string
        city:
          type: string
    SessionCreate:
      description: 'Create a session in exactly one of three ways: for an existing applicant, inline as a document-sourced
        session, or from a verified reusable credential.'
      oneOf:
      - type: object
        required:
        - applicant_id
        - level
        properties:
          applicant_id:
            type: string
            format: uuid
          level:
            type: integer
            enum:
            - 1
            - 2
            - 3
          expires_hours:
            type: integer
            minimum: 1
            default: 24
      - type: object
        required:
        - identity_source
        - country
        - level
        properties:
          identity_source:
            type: string
            enum:
            - document
          country:
            type: string
            example: NG
          external_ref:
            type: string
          level:
            type: integer
            enum:
            - 1
            - 2
            - 3
          expires_hours:
            type: integer
            minimum: 1
            default: 24
      - type: object
        required:
        - credential
        - level
        properties:
          credential:
            $ref: '#/components/schemas/Credential'
          level:
            type: integer
            enum:
            - 1
            - 2
            - 3
          expires_hours:
            type: integer
            minimum: 1
            default: 24
    SessionCreated:
      type: object
      required:
      - id
      - level
      - env
      - status
      - applicant_id
      - flow_url
      - flow_token
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
          enum:
          - 1
          - 2
          - 3
        env:
          $ref: '#/components/schemas/Environment'
        status:
          $ref: '#/components/schemas/SessionStatus'
        applicant_id:
          type: string
          format: uuid
        identity_source:
          $ref: '#/components/schemas/IdentitySource'
        flow_url:
          type: string
          example: /flow/REPLACE_WITH_TOKEN
          description: Path on the KYC host. Prepend https://kyc.novamail.store in production.
        flow_token:
          type: string
          description: Sensitive one-session token. Do not log it or expose it to another user.
        expires_at:
          type: string
          format: date-time
        credential_id:
          type:
          - string
          - 'null'
          format: uuid
        inherited_checks:
          type: array
          items:
            type: string
    Decision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        env:
          $ref: '#/components/schemas/Environment'
        outcome:
          type: string
          enum:
          - approved
          - rejected
          - needs_review
          - needs_more_information
        decided_by:
          type: string
          example: engine
        reason:
          type:
          - string
          - 'null'
        reason_codes:
          type: array
          items:
            type: string
        rules_version:
          type: string
        risk_score:
          type:
          - number
          - 'null'
        risk_band:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        risk_contributions:
          type: array
          items:
            type: object
            additionalProperties: true
        config_version:
          type:
          - integer
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        env:
          $ref: '#/components/schemas/Environment'
        applicant_id:
          type: string
          format: uuid
        identity_source:
          $ref: '#/components/schemas/IdentitySource'
        level:
          type: integer
          enum:
          - 1
          - 2
          - 3
        status:
          $ref: '#/components/schemas/SessionStatus'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        client_ip_masked:
          type:
          - string
          - 'null'
        ip_country:
          type:
          - string
          - 'null'
        vpn_status:
          type:
          - string
          - 'null'
        checks_summary:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
        decision:
          oneOf:
          - $ref: '#/components/schemas/Decision'
          - type: 'null'
        credential:
          $ref: '#/components/schemas/Credential'
        case_id:
          type: string
          format: uuid
      additionalProperties: true
    Check:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        env:
          $ref: '#/components/schemas/Environment'
        type:
          type: string
          example: face_match
        provider:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/CheckStatus'
        findings:
          type: object
          additionalProperties: true
        reason_codes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Credential:
      type: object
      description: A signed reusable verification credential. It carries claims only, never document images or biometric data.
      properties:
        claims:
          type: object
          additionalProperties: true
        signature:
          type: string
      additionalProperties: true
    FlowConfig:
      type: object
      required:
      - required_checks
      - face_pass_threshold
      - face_margin
      - risk_auto_approve_ceiling
      - poa_window_days
      - screening_threshold
      - sla_hours
      - four_eyes
      properties:
        required_checks:
          type: array
          items:
            type: string
        face_pass_threshold:
          type: number
          minimum: 0
          maximum: 1
        face_margin:
          type: number
          minimum: 0
          maximum: 1
        risk_auto_approve_ceiling:
          type: number
          minimum: -1
          maximum: 100
        poa_window_days:
          type: integer
          minimum: 1
        screening_threshold:
          type: number
          minimum: 0
          maximum: 100
        sla_hours:
          type: integer
          minimum: 1
        four_eyes:
          type: boolean
    FlowConfigPatch:
      type: object
      minProperties: 1
      description: Partial configuration. Unknown keys and out-of-range values are rejected with 422.
      properties:
        required_checks:
          type: array
          minItems: 1
          items:
            type: string
        face_pass_threshold:
          type: number
          minimum: 0
          maximum: 1
        face_margin:
          type: number
          minimum: 0
          maximum: 1
        risk_auto_approve_ceiling:
          type: number
          minimum: -1
          maximum: 100
        poa_window_days:
          type: integer
          minimum: 1
        screening_threshold:
          type: number
          minimum: 0
          maximum: 100
        sla_hours:
          type: integer
          minimum: 1
        four_eyes:
          type: boolean
    WebhookCreate:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          example: https://api.example.com/webhooks/nova-kyc
          description: Public HTTP(S) receiver. Private, loopback, link-local and reserved targets are refused at delivery
            by the SSRF guard.
        events:
          type: array
          description: Implemented event names. An empty list subscribes to every event.
          items:
            type: string
            enum:
            - session.completed
            - case.opened
            - case.decided
            - applicant.deleted
            - screening.hit_new
    WebhookCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Shown once. Store it in a secret manager.
        note:
          type: string
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event:
          type: string
        payload:
          type: string
          description: The exact JSON body that was signed and delivered.
        signature:
          type: string
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
          - dead_letter
        attempts:
          type: integer
        response_summary:
          type:
          - string
          - 'null'
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        dead_lettered_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    WebhookEvent:
      type: object
      required:
      - event
      - data
      properties:
        event:
          type: string
          enum:
          - session.completed
          - case.opened
          - case.decided
          - applicant.deleted
          - screening.hit_new
        data:
          type: object
          additionalProperties: true
          description: Event-specific decision data. It never contains document images or raw biometric data.
    TenantUserCreate:
      type: object
      required:
      - name
      - role
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - reviewer
    TenantUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - reviewer
        token_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: true
    BusinessCreate:
      type: object
      required:
      - legal_name
      - registration_number
      - country
      properties:
        legal_name:
          type: string
        registration_number:
          type: string
        country:
          type: string
          description: Country with a registration-number format in the platform registry.
    BusinessPersonCreate:
      type: object
      required:
      - applicant_id
      - role
      properties:
        applicant_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - director
          - ubo
        ownership_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        env:
          $ref: '#/components/schemas/Environment'
        legal_name:
          type: string
        registration_number:
          type: string
        country:
          type: string
        status:
          type: string
          enum:
          - pending
          - verified
          - rejected
        registry_status:
          type: string
        registry_source:
          type:
          - string
          - 'null'
        registry_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        registry_lookup_status:
          type:
          - string
          - 'null'
        people:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        screening_hits:
          type: array
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    CaseDecision:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
          - request_more
        reason:
          type: string
          minLength: 1
    CaseConfirm:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
    HitDisposition:
      type: object
      required:
      - disposition
      - reason
      properties:
        disposition:
          type: string
          enum:
          - confirmed
          - false_positive
        reason:
          type: string
          minLength: 1
    CredentialVerifyRequest:
      type: object
      required:
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
    CredentialVerifyResponse:
      type: object
      required:
      - valid
      properties:
        valid:
          type: boolean
        reason:
          type: string
        claims:
          type: object
          additionalProperties: true
    FlowConsent:
      type: object
      properties:
        text_version:
          type: string
        locale:
          type: string
          example: en
        device_tz:
          type: string
          example: Africa/Lagos
          description: IANA timezone reported by the applicant device; used only as a corroborating location signal.
        webrtc_ips:
          type: array
          items:
            type: string
          description: WebRTC candidate addresses reported by the flow for the VPN/proxy assessment.
    FlowSession:
      type: object
